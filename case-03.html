<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一台查询屏，怎样才算好用｜项目03案例解析</title><style>
:root{--ink:#183f47;--teal:#2f6d70;--accent:#d0825c}*{box-sizing:border-box}body{margin:0;background:#e9f1ee;color:var(--ink);font-family:'Microsoft YaHei',sans-serif;line-height:1.65}button{font:inherit;cursor:pointer}header{padding:17px 24px;background:#193c43;color:#eff9f5}header div{max-width:960px;margin:auto;display:flex;justify-content:space-between;gap:10px}header a{color:inherit;text-decoration:none;font:18px SimSun,serif}header small{letter-spacing:.12em}.wrap{max-width:960px;margin:auto;padding:0 24px}h1,h2{font-family:SimSun,serif;font-weight:normal;line-height:1.35}h1{font-size:clamp(30px,5vw,46px);margin:8px 0 14px}h2{font-size:25px}.hero{padding-top:30px}.label{font-size:12px;color:#a75a3d;letter-spacing:.12em}.start{padding:20px;background:#fff;border-radius:4px}.start p{margin:0 0 12px}button{border:1px solid #b7d0ca;background:#f5faf7;color:var(--ink);padding:11px 15px;transition:transform .2s,box-shadow .2s,background .2s}button:hover{transform:translateY(-3px);box-shadow:0 8px 20px #193c4320}button:active{transform:scale(.98)}button[aria-pressed=true]{background:#2f6d70;color:white}.buttons{display:flex;gap:8px;flex-wrap:wrap}.feedback{background:#e0f0e9;border-left:3px solid #679f90;padding:13px 15px;margin-top:12px}.feedback[hidden],.panel[hidden]{display:none}.image{display:block;width:100%;margin-top:20px}.caption{font-size:12px;color:#69857f}.content{padding:36px 0 60px}section{margin:0 0 45px}.hint{font-size:14px;color:#64817a}.personas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.persona{background:white;text-align:left;min-height:110px}.persona small{display:block;color:#bf7955;font:20px Georgia}.persona b{display:block;margin-top:8px}.panel{margin-top:10px;background:#fff;padding:18px;border-top:3px solid #76a799}.design{background:#1e4851;color:#fff;padding:28px}.design .label{color:#edbc98}.design button{display:block;width:100%;text-align:left;margin-top:10px;background:transparent;color:white;border-color:#8aafaa}.design button[aria-pressed=true]{background:#e3f2e9;color:#183f47}.design .feedback{color:#183f47}.key{display:flex;gap:12px}.key div{flex:1;background:#fff;padding:18px;border-bottom:3px solid #7eb09b}.key strong{font:20px SimSun,serif}.key p{font-size:14px;color:#68837c;margin-bottom:0}.footer{border-top:1px solid #cadbd5;padding-top:18px;font-size:12px;color:#708a84}button:focus-visible,a:focus-visible{outline:3px solid #bd7955;outline-offset:3px}@media(max-width:600px){.wrap{padding:0 18px}header div{flex-direction:column}.hero{padding-top:22px}.personas{gap:6px}.persona{padding:10px;font-size:14px}.persona small{font-size:17px}.design{padding:20px}.key div{padding:14px}.key strong{font-size:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div><a href="./">高铁精神与职业素养</a><small>PROJECT 03 / 案例解析</small></div></header><main class="wrap"><div class="hero"><span class="label">CASE 03 · 智能服务</span><h1>一台查询屏，怎样才算好用？</h1><div class="start"><p>车站增加了一台自助查询屏。设备装好了，就代表服务变好了吗？</p><div class="buttons"><button data-start="0">当然</button><button data-start="1">还要看看使用情况</button></div><div id="start-feedback" class="feedback" hidden aria-live="polite"></div></div><img class="image" src="case-03-scene.png" alt="车站工作人员与旅客使用信息设备的教学插画"><p class="caption">教学模拟情境 · 插画不指代具体车站或设备</p></div><div class="content"><section><span class="label">01 / 换个视角看</span><h2>不同的人，遇到什么问题？</h2><p class="hint">点击人物卡，查看他们的观察。</p><div class="personas"><button class="persona" data-person="0"><small>01</small><b>第一次进站的旅客</b></button><button class="persona" data-person="1"><small>02</small><b>需要帮助的旅客</b></button><button class="persona" data-person="2"><small>03</small><b>现场工作人员</b></button></div><div id="person-panel" class="panel" hidden aria-live="polite"></div></section><section class="design"><span class="label">02 / 做个选择</span><h2>怎样判断查询屏有没有帮助？</h2><button data-design="0">只看屏幕尺寸和功能数量</button><button data-design="1">观察旅客能否找到信息，并收集使用反馈</button><button data-design="2">设备亮着，就不需要再看</button><div id="design-feedback" class="feedback" hidden aria-live="polite"></div></section><section><span class="label">03 / 案例解析</span><h2>智能服务，需要技术与人配合</h2><div class="key"><div><strong>设备提供线索</strong><p>信息应清楚，来源和适用范围可辨认。</p></div><div><strong>人员接续帮助</strong><p>关注具体需要，必要时核实并提供支持。</p></div></div></section><div class="footer">项目 03 · 从智能高铁看新时代铁路担当<br>自主练习，不保存作答内容。</div></div></main><script>
function group(selector,target,answers){const buttons=document.querySelectorAll(selector),out=document.querySelector(target);buttons.forEach((b,i)=>b.addEventListener('click',()=>{buttons.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');out.textContent=answers[i];out.hidden=false}))}group('[data-start]','#start-feedback',['再想想：有设备不等于每个人都能顺利使用。','对。还要观察是否能解决旅客的实际问题。']);group('[data-person]','#person-panel',['入口在哪里？信息能否帮助我找到下一步？','文字、操作方式是否清楚？需要时能否得到人工帮助？','系统信息是否及时、准确？遇到疑问如何核实和接续？']);group('[data-design]','#design-feedback',['再想想：功能多少不能直接证明旅客用得顺畅。','比较合适：观察、反馈和后续改进能帮助检验实际效果。','再想想：设备运行还需持续观察和维护。']);
</script></body></html>
