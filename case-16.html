</style></head><body><header><div class="bar"><a href="./">高铁精神与职业素养</a><small>PROJECT 16 / 案例解析</small></div></header><main class="wrap"><div class="hero"><span class="label">CASE 16 · 国际交流</span><h1>一场共同的学习</h1><div class="start"><p>培训中讲解了一遍，就能确定对方理解了吗？</p><div class="buttons"><button data-first="0">是的</button><button data-first="1">还需要确认</button></div><div id="first" class="feedback" hidden aria-live="polite"></div></div><div class="visual" role="img" aria-label="不同背景的学员围绕模型共同学习的教学插画"></div><p class="caption">教学模拟情境 · 图片为课程插画</p></div><div class="content"><section><span class="label">01 / 打开交流卡</span><h2>如何让大家形成共同理解？</h2><p class="hint">点击卡片，看看每个环节的作用。</p><div class="route"><button data-node="0"><small>01</small><strong>讲解</strong>说明对象 ↗</button><button data-node="1"><small>02</small><strong>示范</strong>对应实物 ↗</button><button data-node="2"><small>03</small><strong>反馈</strong>确认理解 ↗</button></div><div id="node" class="feedback" hidden aria-live="polite"></div></section><section class="planning"><span class="label">02 / 一次培训交流</span><h2>怎样确认学员理解了关键内容？</h2><div class="buttons"><button data-choice="0">讲完一次就假定大家理解</button><button data-choice="1">结合模型示范，邀请学员练习并反馈</button></div><div id="choice" class="feedback" hidden aria-live="polite"></div></section><section><span class="label">03 / 案例解析</span><h2>职业形象，体现在共同成长</h2><div class="summary"><div><strong>准确表达</strong><p>让名称与实际对象对应。</p></div><div><strong>尊重与反馈</strong><p>通过练习与交流确认理解。</p></div></div></section><div class="footer">项目 16 · 从中国高铁走向世界看职业形象<br>教学模拟；练习应依据学习阶段和要求安排。本页不保存内容。</div></div></main><script>
function group(sel,id,words){const bs=document.querySelectorAll(sel),out=document.querySelector(id);bs.forEach((b,i)=>b.addEventListener('click',()=>{bs.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');out.textContent=words[i];out.hidden=false}))}group('[data-first]','#first',['再想想：讲过一遍不代表对方已经理解。','对。可以通过示范、练习与反馈确认理解。']);group('[data-node]','#node',['说明名称和用途，并与实际对象对应。','结合模型演示，让学员把讲解与对象联系起来。','邀请学员提问、练习或复述，发现理解差异。']);group('[data-choice]','#choice',['再想想：讲过并不代表对方已经理解。','合适。示范与练习反馈有助于形成共同理解。']);
</script></body></html>
