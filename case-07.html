<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交接前的一分钟｜项目07案例解析</title><style>
:root{--ink:#273f50;--red:#a65449;--line:#cbd5da}*{box-sizing:border-box}body{margin:0;background:#f1ece2;color:var(--ink);font-family:'Microsoft YaHei',sans-serif;line-height:1.65}button{font:inherit;cursor:pointer}header{padding:17px 24px;background:#293f4e;color:#f7f5ee}header div{max-width:920px;margin:auto;display:flex;justify-content:space-between;gap:10px}header a{color:inherit;text-decoration:none;font:18px SimSun,serif}header small{letter-spacing:.12em}.wrap{max-width:920px;margin:auto;padding:0 24px}.hero{padding-top:28px}.label{font-size:12px;letter-spacing:.13em;color:var(--red)}h1,h2{font-family:SimSun,serif;font-weight:normal;line-height:1.35}h1{font-size:clamp(30px,5vw,44px);margin:8px 0 14px}h2{font-size:25px}.start{background:#fffdfa;border-left:4px solid var(--red);padding:20px}.start p{margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}button{background:#f8faf9;border:1px solid #c3d0d4;color:var(--ink);padding:11px 15px;transition:transform .2s,box-shadow .2s,background .2s}button:hover{transform:translateY(-3px);box-shadow:0 8px 20px #293f4e20}button:active{transform:scale(.98)}button[aria-pressed=true]{background:#365365;color:#fff}.feedback{background:#dfece7;border-left:3px solid #769c8d;margin-top:12px;padding:13px 15px}.feedback[hidden]{display:none}.visual{margin-top:20px;height:clamp(225px,42vw,370px);background:#d6dbdc url('case-07-scene.png') center 31% / cover no-repeat}.caption,.hint{font-size:13px;color:#72858d}.content{padding:35px 0 60px}section{margin-bottom:46px}.sheet{background:#fffdfa;border:1px solid #ccd5d7;padding:20px}.sheet header{padding:0 0 12px;background:none;color:inherit;border-bottom:1px solid var(--line)}.sheet-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #e0e6e7}.sheet-row span{flex:1}.sheet-row button{font-size:13px}.record{background:#2c4657;color:#f9f8f3;padding:26px}.record .label{color:#f1b5a0}.record button{width:100%;text-align:left;margin-top:8px;background:transparent;color:#fff;border-color:#76909a}.record button[aria-pressed=true]{background:#e3ede8;color:var(--ink)}.record .feedback{color:var(--ink)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary div{background:#fffdfa;padding:18px;border-top:2px solid #b96958}.summary strong{font:20px SimSun,serif}.summary p{font-size:14px;color:#71858d;margin-bottom:0}.footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:#71858d}button:focus-visible,a:focus-visible{outline:3px solid #bd7955;outline-offset:3px}@media(max-width:600px){.wrap{padding:0 18px}header div{flex-direction:column}.hero{padding-top:22px}.visual{height:220px}.record{padding:20px}.summary{gap:6px}.summary div{padding:12px}.summary strong{font-size:17px}.summary p{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.sheet select{font:inherit;color:#273f50;background:#f4f8f7;border:1px solid #c3d0d4;padding:10px;max-width:65%;min-height:44px}.handoff{background:#e3ede8;padding:15px;margin-top:12px}.handoff[hidden]{display:none}</style></head><body><header><div><a href="./">高铁精神与职业素养</a><small>PROJECT 07 / 案例解析</small></div></header><main class="wrap"><div class="hero"><span class="label">CASE 07 · 岗位交接</span><h1>交接前的一分钟</h1><div class="start"><p>只说“工作完成”，下一班就能顺利接手吗？</p><div class="row"><button data-first="0">可以</button><button data-first="1">还需要说明</button></div><div id="first" class="feedback" hidden aria-live="polite"></div></div><div class="visual" role="img" aria-label="工作人员在交接时核对记录的教学插画"></div><p class="caption">教学模拟情境 · 具体交接应遵循岗位规定</p></div><div class="content"><section><span class="label">01 / 补全交接卡</span><h2>让下一班看得明白</h2><p class="hint">按模拟情境选择说明，再生成交接提示。</p><div class="sheet"><header>交接卡 <small>教学示意</small></header><div class="sheet-row"><span>当前状态</span><select id="status" aria-label="当前状态"><option value="">请选择</option><option value="clear">说明对象与当前进度</option><option value="vague">只写“都好了”</option></select></div><div class="sheet-row"><span>未确认信息</span><select id="pending" aria-label="未确认信息"><option value="">请选择</option><option value="clear">说明还需核实的事项</option><option value="vague">不提未确认内容</option></select></div><button id="build">生成交接提示</button><div id="handoff" class="handoff" hidden aria-live="polite"></div></div></section><section class="record"><span class="label">02 / 再确认一次</span><h2>发出去，就等于对方理解了吗？</h2><button data-answer="0">是，不需要再确认</button><button data-answer="1">不一定，必要时请对方复述或核对</button><div id="answer" class="feedback" hidden aria-live="polite"></div></section><section><span class="label">03 / 案例解析</span><h2>坚守，需要可靠的接续</h2><div class="summary"><div><strong>对象清楚</strong><p>知道交接什么</p></div><div><strong>状态清楚</strong><p>知道进度与依据</p></div><div><strong>疑问清楚</strong><p>知道什么待确认</p></div></div></section><div class="footer">项目 07 · 零失误背后的岗位坚守<br>本页为教学练习，不保存内容。</div></div></main><script>
function group(sel,id,words){const bs=document.querySelectorAll(sel),out=document.querySelector(id);bs.forEach((b,i)=>b.addEventListener('click',()=>{bs.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');out.textContent=words[i];out.hidden=false}))}group('[data-first]','#first',['再想想：接班者还需要对象、状态和待确认事项。','对。清楚的信息能帮助接班者继续工作。']);group('[data-answer]','#answer',['再想想：信息送达不等于对方已经理解。','对。复述与核对有助于发现理解差异。']);const status=document.querySelector('#status'),pending=document.querySelector('#pending'),handoff=document.querySelector('#handoff');document.querySelector('#build').addEventListener('click',()=>{handoff.hidden=false;if(!status.value||!pending.value){handoff.textContent='请先完成两项选择。';return}if(status.value!=='clear'||pending.value!=='clear'){handoff.textContent='还需补充具体状态和待核实事项，再试一次。';return}handoff.textContent='交接提示：说明对象与进度，列出待核实事项，并与接班人确认理解。'});
</script></body></html>
