<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一件工具的交付｜项目08案例解析</title><style>

n{background:transparent;color:#fff;border-color:#ac927c}.planning button:hover{background:#7b6351}.track{min-height:48px;border:1px dashed #aa9480;padding:9px 13px;margin:12px 0}.planning .feedback{color:var(--ink)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary div{background:#fffaf1;padding:19px;border-top:2px solid #c48a65}.summary strong{font:20px SimSun,serif}.summary p{font-size:14px;color:#887665;margin-bottom:0}.footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:#8a7764}button:focus-visible,a:focus-visible{outline:3px solid #c67f51;outline-offset:3px}@media(max-width:600px){.wrap{padding:0 18px}.bar{flex-direction:column}.hero{padding-top:22px}.visual{height:220px}.route{gap:6px}.route button{font-size:14px;padding:10px;min-height:104px}.planning{padding:19px}.summary div{padding:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="bar"><a href="./">高铁精神与职业素养</a><small>PROJECT 08 / 案例解析</small></div></header><main class="wrap"><div class="hero"><span class="label">CASE 08 · 设备维护与工匠精神</span><h1>一件工具的交付</h1><div class="start"><p>工具摆放整齐，就代表管理已经做好了吗？</p><div class="buttons"><button data-first="0">是的</button><button data-first="1">还需要检查</button></div><div id="first" class="feedback" hidden aria-live="polite"></div></div><div class="visual" role="img" aria-label="师徒共同查看设备和记录的教学插画"></div><p class="caption">教学模拟情境 · 图片为课程插画</p></div><div class="content"><section><span class="label">01 / 看看工具卡</span><h2>除了整齐，还应说明什么？</h2><p class="hint">点击卡片，查看对下一位使用者的帮助。</p><div class="route"><button data-node="0"><small>01</small><strong>用途</strong>为什么用 ↗</button><button data-node="1"><small>02</small><strong>条件</strong>什么时候用 ↗</button><button data-node="2"><small>03</small><strong>归还位置</strong>用完放哪里 ↗</button></div><div id="node" class="feedback" hidden aria-live="polite"></div></section><section class="planning"><span class="label">02 / 让同伴试一试</span><h2>如何检验整理是否有效？</h2><div class="buttons"><button data-choice="0">只拍一张整齐的照片</button><button data-choice="1">请未参与整理的同伴尝试查找并反馈</button></div><div id="choice" class="feedback" hidden aria-live="polite"></div></section><section><span class="label">03 / 案例解析</span><h2>工匠精神，落在实际质量上</h2><div class="summary"><div><strong>理解用途</strong><p>将工具和任务联系起来。</p></div><div><strong>验证效果</strong><p>让他人能够找到、使用和交接。</p></div></div></section><div class="footer">项目 08 · 从设备维护看工匠精神<br>教学模拟；实际操作遵循相应要求。本页不保存内容。</div></div></main><script>
function group(sel,id,words){const bs=document.querySelectorAll(sel),out=document.querySelector(id);bs.forEach((b,i)=>b.addEventListener('click',()=>{bs.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');out.textContent=words[i];out.hidden=false}))}group('[data-first]','#first',['再想想：外观整齐还不能说明工具能被正确找到和使用。','对。还应考虑用途、适用条件和交接。']);group('[data-node]','#node',['写明工具用于什么任务，避免仅凭外观判断。','说明适用条件与相关要求；具体使用应接受指导并遵循规定。','清楚标示归还位置，方便下一位使用者查找。']);group('[data-choice]','#choice',['再想想：照片不能证明同伴能找到并理解工具。','合适。让他人尝试查找并反馈，可以发现说明和交接中的遗漏。']);
</script></body></html>
