<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从看懂到能做好｜项目13案例解析</title><style>
:root{--ink:#4a4037;--rust:#a75941;--sand:#f4ead9;--line:#d6c4ad}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--sand);font-family:'Microsoft YaHei',sans-serif;line-height:1.7}button{font:inherit;cursor:pointer}header{background:#544437;color:#fff9ef;padding:17px 24px}.bar{max-width:920px;margin:auto;display:flex;justify-content:space-between;gap:10px}.bar a{font:18px SimSun,serif;color:inherit;text-decoration:none}.bar small{letter-spacing:.13em}.wrap{max-width:920px;margin:auto;padding:0 24px}.hero{padding-top:28px}.label{font-size:12px;letter-spacing:.14em;color:var(--rust)}h1,h2{font-family:SimSun,serif;font-weight:normal;line-height:1.35}h1{font-size:clamp(32px,5vw,46px);margin:8px 0 14px}h2{font-size:26px}.start{background:#fffaf1;border-left:4px solid var(--rust);padding:20px}.start p{margin:0 0 12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{color:var(--ink);background:#fffaf1;border:1px solid #d6c1a7;padding:11px 16px;transition:transform .2s,box-shadow .2s,background .2s}button:hover{transform:translateY(-3px);box-shadow:0 8px 20px #5d493123}button:active{transform:scale(.98)}button[aria-pressed=true]{background:#805d49;color:#fff}.feedback{background:#f0e2cc;border-left:3px solid #bd8a5c;padding:13px 15px;margin-top:12px}.feedback[hidden]{display:none}.visual{margin-top:20px;height:clamp(225px,42vw,370px);background:#e7d6be url('case-13-scene.png') center 35% / cover no-repeat}.caption,.hint{font-size:13px;color:#8a7764}.content{padding:35px 0 60px}section{margin-bottom:46px}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}.route button{text-align:left;min-height:118px;background:#fffaf1}.route button[aria-pressed=true]{background:#805d49}.route small{display:block;font:20px Georgia;color:#bf8063}.route button[aria-pressed=true] small{color:#f5cfab}.route strong{display:block;margin:8px 0}.planning{background:#604c3d;color:#fff8ef;padding:26px}.planning .label{color:#f2c1a1}.planning button{background:transparent;color:#fff;border-color:#ac927c}.planning button:hover{background:#7b6351}.track{min-height:48px;border:1px dashed #aa9480;padding:9px 13px;margin:12px 0}.planning .feedback{color:var(--ink)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary div{background:#fffaf1;padding:19px;border-top:2px solid #c48a65}.summary strong{font:20px SimSun,serif}.summary p{font-size:14px;color:#887665;margin-bottom:0}.footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:#8a7764}button:focus-visible,a:focus-visible{outline:3px solid #c67f51;outline-offset:3px}@media(max-width:600px){.wrap{padding:0 18px}.bar{flex-direction:column}.hero{padding-top:22px}.visual{height:220px}.route{gap:6px}.route button{font-size:14px;padding:10px;min-height:104px}.planning{padding:19px}.summary div{padding:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div class="bar"><a href="./">高铁精神与职业素养</a><small>PROJECT 13 / 案例解析</small></div></header><main class="wrap"><div class="hero"><span class="label">CASE 13 · 跟岗成长</span><h1>从看懂到能做好</h1><div class="start"><p>看懂一次示范，就能独立承担岗位任务吗？</p><div class="buttons"><button data-first="0">是的</button><button data-first="1">还需要练习</button></div><div id="first" class="feedback" hidden aria-live="polite"></div></div><div class="visual" role="img" aria-label="师傅指导学生观察设备的教学插画"></div><p class="caption">教学模拟情境 · 图片为课程插画</p></div><div class="content"><section><span class="label">01 / 探索成长</span><h2>学习需要哪些支持？</h2><p class="hint">点击三个节点，看看每一步有什么价值。</p><div class="route"><button data-node="0"><small>01</small><strong>观察示范</strong>先看清 ↗</button><button data-node="1"><small>02</small><strong>指导练习</strong>再动手 ↗</button><button data-node="2"><small>03</small><strong>反馈改进</strong>再提高 ↗</button></div><div id="node" class="feedback" hidden aria-live="polite"></div></section><section class="planning"><span class="label">02 / 连接学习路径</span><h2>试着安排学习过程</h2><p>按顺序点击，拼出一种循序渐进的学习过程。</p><div class="buttons"><button data-part="2">接受反馈</button><button data-part="0">观察示范</button><button data-part="1">指导下练习</button></div><div id="track" class="track" aria-live="polite">还没有选择环节</div><div class="buttons"><button id="check">检查顺序</button><button id="reset">重新安排</button></div><div id="check-result" class="feedback" hidden aria-live="polite"></div></section><section><span class="label">03 / 案例解析</span><h2>在共同任务中逐步成长</h2><div class="summary"><div><strong>能力需要练习</strong><p>观察示范后，在指导下练习并接受评价。</p></div><div><strong>成长需要支持</strong><p>师傅、同伴和组织共同支持学习与适应。</p></div></div></section><div class="footer">项目 13 · 从学生到铁路人的角色转变<br>本页不保存作答内容。</div></div></main><script>
function pick(sel,id,answers){const buttons=document.querySelectorAll(sel),out=document.querySelector(id);buttons.forEach((b,i)=>b.addEventListener('click',()=>{buttons.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');out.textContent=answers[i];out.hidden=false}))}pick('[data-first]','#first',['再想想：看懂不等于能够独立承担，还需要练习与评价。','对。能力需要通过指导、练习与反馈逐步确认。']);pick('[data-node]','#node',['观察示范并辨认对象，是理解任务的起点。','在指导下练习，遇到不清楚的问题及时请教。','接受评价和反馈，再根据建议持续改进。']);let chosen=[];const names=['观察示范','指导下练习','接受反馈'],parts=document.querySelectorAll('[data-part]'),track=document.querySelector('#track'),answer=document.querySelector('#check-result');function draw(){track.textContent=chosen.length?chosen.map(i=>names[i]).join(' → '):'还没有选择环节';parts.forEach(b=>{let on=chosen.includes(Number(b.dataset.part));b.setAttribute('aria-pressed',String(on))});answer.hidden=true}parts.forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.part);if(!chosen.includes(i))chosen.push(i);draw()}));document.querySelector('#reset').addEventListener('click',()=>{chosen=[];draw()});document.querySelector('#check').addEventListener('click',()=>{answer.textContent=chosen.length<3?'请先选择全部三个环节。':chosen.every((n,i)=>n===i)?'顺序合理！观察、指导练习与反馈相互支持。':'顺序还可以调整，点击“重新安排”再试一次。';answer.hidden=false});
</script></body></html>
