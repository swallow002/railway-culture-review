<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一次成功之后｜项目02案例解析</title><style>
:root{--ink:#263a52;--blue:#436784;--orange:#b66c4d}*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:var(--ink);font-family:'Microsoft YaHei',sans-serif;line-height:1.65}button{font:inherit;cursor:pointer}header{background:#253b52;color:white;padding:18px 24px}header div{max-width:960px;margin:auto;display:flex;justify-content:space-between;gap:12px}header a{color:inherit;text-decoration:none;font-family:SimSun,serif;font-size:18px}header small{letter-spacing:.12em}.wrap{max-width:960px;margin:auto;padding:0 24px}h1,h2{font:normal 28px/1.35 SimSun,serif}h1{font-size:clamp(32px,5vw,46px);margin:8px 0 14px}.hero{padding-top:30px}.label{font-size:12px;color:var(--orange);letter-spacing:.13em}.intro{background:#fff;padding:22px;border-left:4px solid #b97253}.intro p{margin:0 0 12px}button{border:1px solid #bccbd5;color:var(--ink);background:#f5f8f8;padding:11px 15px;transition:transform .2s,box-shadow .2s,background .2s}button:hover{transform:translateY(-3px);box-shadow:0 8px 20px #253b5220}button:active{transform:scale(.98)}button[aria-pressed=true]{background:#345b77;color:white}.choice-row{display:flex;gap:8px;flex-wrap:wrap}.result{background:#e1edf2;padding:14px 16px;margin-top:12px}.result[hidden]{display:none}.image{width:100%;display:block;margin-top:20px}.caption{font-size:12px;color:#71828e}.content{padding-top:35px;padding-bottom:60px}section{margin-bottom:46px}section h2{margin:12px 0}.note{color:#657987;font-size:14px}.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.checklist button{text-align:left;background:#fff;min-height:65px}.checklist button[aria-pressed=true]{background:#dceaf1;box-shadow:inset 4px 0 #436784}.submit{margin-top:15px;background:#345b77;color:white;border-color:#345b77}.lab{background:#273d53;color:#fff;padding:27px}.lab .label{color:#e3ae91}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:transparent;color:#fff;border-color:#7793a5}.tabs button[aria-pressed=true]{background:#edf3f5;color:#263a52}.readout{background:#f7f9f8;color:#263a52;padding:16px;margin-top:12px}.readout[hidden]{display:none}.closing{border-top:1px solid #c5d2d9;padding-top:20px;color:#657987;font-size:13px}button:focus-visible,a:focus-visible{outline:3px solid #bd7756;outline-offset:3px}@media(max-width:600px){.wrap{padding:0 18px}header div{flex-direction:column}.hero{padding-top:22px}.intro,.lab{padding:19px}.checklist{grid-template-columns:1fr}h1{font-size:30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div><a href="./">高铁精神与职业素养</a><small>PROJECT 02 / 案例解析</small></div></header><main class="wrap"><div class="hero"><span class="label">CASE 02 · 技术攻关</span><h1>一次成功之后</h1><div class="intro"><p>一项模型试验结果不错，可以马上推广到所有条件吗？</p><div class="choice-row"><button data-start="0">可以</button><button data-start="1">还需要验证</button></div><div id="start-result" class="result" hidden aria-live="polite"></div></div><img class="image" src="case-02-scene.png" alt="工程人员围绕列车模型进行研究的教学插画"><p class="caption">教学模拟情境 · 插画为课程素材，不指代具体试验</p></div><div class="content"><section><span class="label">01 / 选出需要核对的线索</span><h2>这次结果，能说明什么？</h2><p class="note">点击选择需要了解的信息，可多选。</p><div class="checklist"><button data-pick="0" aria-pressed="false">试验对象和条件</button><button data-pick="1" aria-pressed="false">测量方式与记录</button><button data-pick="2" aria-pressed="false">其他条件下的验证</button><button data-pick="3" aria-pressed="false">只看报告封面</button></div><button class="submit" id="check">检查我的选择</button><div id="check-result" class="result" hidden aria-live="polite"></div></section><section class="lab"><span class="label">02 / 打开研究记录</span><h2>攻关如何一步步推进？</h2><div class="tabs"><button data-tab="0">现象</button><button data-tab="1">条件</button><button data-tab="2">验证</button></div><div id="tab-result" class="readout" hidden aria-live="polite"></div></section><section><span class="label">03 / 案例解析</span><h2>让结论有依据，也有边界</h2><p>从具体问题出发，保留条件与证据；通过反复验证，让不同专业能够共同使用结果。</p></section><div class="closing">项目 02 · 高铁速度背后的技术攻关精神<br>自主练习，不保存作答内容。</div></div></main><script>
const result=(id,text)=>{const el=document.querySelector(id);el.textContent=text;el.hidden=false};const start=document.querySelectorAll('[data-start]');start.forEach((b,i)=>b.addEventListener('click',()=>{start.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');result('#start-result',i?'对，还要看条件、记录和后续验证。':'再想一想：一次结果不能代表所有条件。')}));const picks=document.querySelectorAll('[data-pick]');picks.forEach(b=>b.addEventListener('click',()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')));document.querySelector('#check').addEventListener('click',()=>{const s=Array.from(picks).map(b=>b.getAttribute('aria-pressed')==='true');result('#check-result',s[0]&&s[1]&&s[2]&&!s[3]?'选对了：对象、条件、记录和重复验证共同支持判断。':s[3]?'封面不能说明试验可靠性，再看看其他线索。':'还可以补充：想一想结果是在什么条件下、怎样得到的。')});const tabs=document.querySelectorAll('[data-tab]'),words=['先说清观察到了什么，不把猜测直接写成结论。','记录对象、环境和方法，方便他人理解适用范围。','比较不同条件下的结果，保留记录并与相关专业讨论。'];tabs.forEach((b,i)=>b.addEventListener('click',()=>{tabs.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');result('#tab-result',words[i])}));
</script></body></html>
